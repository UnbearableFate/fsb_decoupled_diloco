run:
  name: fs_diloco_tiny_syncer_bf16_gpu
  run_id: null
  shared_root: /work/xg24i002/x10041/fsb_decoupled_diloco/runs/fs_diloco/{run_id}
  log_level: INFO
model:
  name_or_path: synthetic-tiny
  dtype: bfloat16
  compile: false
  synthetic_vocab_size: 64
  synthetic_hidden_size: 16
data:
  dataset_name: synthetic
  dataset_config_name: null
  block_size: 16
  streaming: false
sync:
  num_learners: 1
  quorum_min: 1
  quorum_max: 1
  max_staleness_versions: 0
  staleness_lambda: 0.25
  selection_policy: most_recent_per_learner
  scan_interval_seconds: 0.2
  grace_window:
    mode: fixed
    fixed_seconds: 0.2
    max_seconds: 0.2
  stop_after_outer_steps: 2
  stop_file_poll_seconds: 0.2
syncer:
  device: cuda
  compute_dtype: bfloat16
  publish_dtype: bfloat16
liveness:
  heartbeat_interval_seconds: 1.0
  stale_after_seconds: 5.0
  dead_after_seconds: 10.0
  no_progress_timeout_seconds: 30.0
training:
  inner_steps: 2
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  max_local_steps: 8
  completion_mode: global_only
  precision: bf16
  seed: 1337
  log_every_steps: 1
  grad_clip: 1.0
inner_optimizer:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0
  scheduler: none
  warmup_steps: 0
outer_optimizer:
  name: nesterov
  lr: 0.5
  momentum: 0.9
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
io:
  tensor_dtype: bfloat16
  atomic_write: true
  compute_sha256: true
learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
wandb:
  enabled: false
coordination:
  leader: {}
config_schema_version: 1
maintenance: {}
