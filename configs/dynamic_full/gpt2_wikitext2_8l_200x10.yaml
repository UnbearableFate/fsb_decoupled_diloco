config_schema_version: 1
run:
  name: dynamic_full_gpt2_wikitext2_8l_200x10
model:
  name_or_path: gpt2
  revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  tokenizer_revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  trust_remote_code: false
  dtype: bfloat16
data:
  dataset_name: Salesforce/wikitext
  dataset_config_name: wikitext-2-raw-v1
  revision: b08601e04326c79dfdd32d625aee71d232d685c3
  train_split: train
  block_size: 1024
  shuffle_blocks: true
sync:
  num_learners: 8
  quorum_min: 4
  quorum_max: 4
  staleness_lambda: 0.0
  scan_interval_seconds: 0.5
  stop_after_outer_steps: 10
syncer:
  device: cpu
  compute_dtype: float32
  publish_dtype: bfloat16
membership:
  mode: dynamic
  stream_pool_size: 8
  bootstrap_instances: 8
  initial_membership_deadline_seconds: 300.0
  registration_scan_interval_seconds: 0.5
  registration_request_ttl_seconds: 120.0
  heartbeat_dead_after_seconds: 15.0
scaling:
  enabled: true
  desired_contributors: 4
  low_contributor_threshold: 3
  consecutive_low_windows: 2
  productive_window_count: 2
  startup_grace_seconds: 90.0
  productive_upload_grace_factor: 2.0
  productive_upload_grace_min_seconds: 15.0
  productive_upload_grace_max_seconds: 120.0
  cooldown_seconds: 10.0
  max_pending_launch_requests: 1
  max_total_launch_requests: 1
  launch_request_ttl_seconds: 120.0
  capacity_observation_retention_count: 32
  scheduler_reconcile_interval_seconds: 2.0
  scheduler_uncertainty_timeout_seconds: 30.0
  starvation_observation_seconds: 10.0
  learner_pbs_script: scripts/miyabi/agent/run_learner.pbs
  learner_walltime: "00:25:00"
  learner_queue: debug-g
terminal:
  admission_close_policy: global_target
  drain_ack_timeout_seconds: 120.0
  registration_visibility_grace_seconds: 2.0
  proposal_visibility_grace_seconds: 10.0
  max_terminal_merges: 0
training:
  inner_steps: 200
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  max_local_steps: 2000
  completion_mode: local_and_global
  seed: 1337
  grad_clip: 1.0
inner_optimizer:
  name: adamw
  lr: 0.00005
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  scheduler: cosine
  warmup_steps: 100
  scheduler_total_steps: 2000
  min_lr_ratio: 0.1
outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
io:
  tensor_dtype: bfloat16
learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
  global_adoption_strategy: replace
  post_publish_latest_wait_seconds: 120.0
  post_publish_latest_poll_seconds: 0.5
leader:
  lease_duration_seconds: 30.0
  renew_interval_seconds: 5.0
  max_clock_skew_seconds: 1.0
  business_busy_timeout_ms: 5000
  candidate_acquire_poll_seconds: 1.0
  candidate_wait_seconds: 180.0
  learner_recovery_wait_seconds: 300.0
maintenance:
  archive_batch_rows: 256
  recent_batch_dedup_count: 64
  quarantine_records_per_contributor: 64
  publication_orphan_grace_seconds: 40.0
