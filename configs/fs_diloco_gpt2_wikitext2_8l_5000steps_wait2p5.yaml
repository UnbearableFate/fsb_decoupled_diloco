run:
  name: fs_diloco_gpt2_wikitext2_8l_5000steps_wait2p5
  run_id: null
  shared_root: null
  log_level: INFO

init:
  resume: false

model:
  name_or_path: gpt2
  trust_remote_code: false
  dtype: bfloat16
  compile: false

data:
  dataset_name: wikitext
  dataset_config_name: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  block_size: 1024
  num_proc: 4
  cache_dir: null
  streaming: false

sync:
  num_learners: 8
  quorum_min: 4
  quorum_max: 8
  max_staleness_versions: 2
  staleness_lambda: 0.25
  selection_policy: most_recent_per_learner
  scan_interval_seconds: 2.0
  grace_window:
    mode: fixed
    fixed_seconds: 20.0
    max_seconds: 60.0
  stop_after_outer_steps: 50
  stop_after_global_tokens: null
  stop_file_poll_seconds: 5.0

liveness:
  heartbeat_interval_seconds: 30.0
  stale_after_seconds: 180.0
  dead_after_seconds: 600.0
  no_progress_timeout_seconds: 3600.0

training:
  inner_steps: 100
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  block_size: 1024
  max_local_steps: 5000
  precision: bf16
  seed: 1337
  log_every_steps: 50
  grad_clip: 1.0

inner_optimizer:
  name: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  scheduler: cosine
  warmup_steps: 100
  scheduler_total_steps: 5000
  min_lr_ratio: 0.1

outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

io:
  tensor_dtype: bfloat16
  atomic_write: true
  compute_sha256: false

learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
  global_adoption_strategy: replace
  post_publish_latest_wait_seconds: 2.5
  post_publish_latest_poll_seconds: 0.2

failure_sim:
  enabled: false
  sleep_jitter_seconds: 0.0
  upload_skip_probability: 0.0
  crash_probability: 0.0

wandb:
  enabled: true
  mode: offline
  entity: null
  group: fs_diloco_gpt2_wikitext2_8l_5000steps_wait2p5
  tags:
    - gpt2
    - wikitext-2
    - 5000-local-steps
    - 8-learners
    - wait-2.5s
