run:
  name: fs_diloco_gpt2_wikitext2_8l_fragment_50x10
  run_id: null
  shared_root: null
  log_level: INFO

init:
  resume: false
  resume_version: latest
  resume_db_dump: null
  allow_overwrite_existing_run: false

model:
  name_or_path: gpt2
  trust_remote_code: false
  dtype: bfloat16
  compile: false

data:
  dataset_name: wikitext
  dataset_config_name: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  block_size: 1024
  num_proc: 4
  cache_dir: null
  streaming: false

sync:
  num_learners: 8
  upload_mode: params
  quorum_min: 4
  quorum_max: 8
  max_staleness_versions: 2
  staleness_lambda: 0.25
  selection_policy: most_recent_per_learner
  scan_interval_seconds: 2.0
  grace_window:
    mode: fixed
    fixed_seconds: 20.0
    max_seconds: 60.0
  db_dump_every_versions: 1
  stop_after_outer_steps: 10
  stop_after_global_tokens: null
  stop_file_poll_seconds: 5.0

liveness:
  heartbeat_interval_seconds: 30.0
  stale_after_seconds: 180.0
  dead_after_seconds: 600.0
  no_progress_timeout_seconds: 1800.0
  quorum_policy: fixed

training:
  inner_steps: 50
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  block_size: 1024
  max_local_steps: null
  precision: bf16
  seed: 1337
  log_every_steps: 25
  grad_clip: 1.0

inner_optimizer:
  name: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  scheduler: cosine
  warmup_steps: 50
  reset_on_global_update: true

outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

io:
  tensor_dtype: bfloat16
  atomic_write: true
  compute_sha256: false
  keep_processed_updates: true
  cleanup_applied_after_versions: null
  keep_last_global_versions: 3
  keep_last_learner_update_versions: null
  sqlite_local_dir: null

learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true

fragments:
  enabled: true
  strategy: balanced_tensor
  num_fragments: 4
  schedule: round_robin_global
  fragments_per_update: 1
  reset_inner_optimizer_on_fragment_adopt: true
  materialize_full_every_events: 1

failure_sim:
  enabled: false
  sleep_jitter_seconds: 0.0
  upload_skip_probability: 0.0
  crash_probability: 0.0

wandb:
  enabled: true
  mode: online
  entity: null
  group: fs_diloco_gpt2_wikitext2_8l_50x10_comparison
  tags:
    - gpt2
    - wikitext-2
    - fragment
    - 50x10
    - 8-learners
    - resource-telemetry
