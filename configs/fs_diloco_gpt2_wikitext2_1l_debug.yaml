run:
  name: fs_diloco_gpt2_wikitext2_1l_debug
  run_id: null
  shared_root: null
  log_level: INFO

model:
  name_or_path: gpt2
  trust_remote_code: false
  dtype: bfloat16
  compile: false

data:
  dataset_name: wikitext
  dataset_config_name: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  block_size: 128
  num_proc: 1
  cache_dir: null
  streaming: false

sync:
  num_learners: 1
  upload_mode: params
  quorum_min: 1
  quorum_max: 1
  max_staleness_versions: 2
  staleness_lambda: 0.25
  selection_policy: most_recent_per_learner
  scan_interval_seconds: 1.0
  grace_window:
    mode: fixed
    fixed_seconds: 1.0
    max_seconds: 1.0
  db_dump_every_versions: 1
  stop_after_outer_steps: 1
  stop_after_global_tokens: null
  stop_file_poll_seconds: 1.0

liveness:
  heartbeat_interval_seconds: 5.0
  stale_after_seconds: 30.0
  dead_after_seconds: 120.0
  no_progress_timeout_seconds: 300.0
  quorum_policy: fixed

training:
  inner_steps: 2
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  block_size: 128
  max_local_steps: 4
  precision: bf16
  seed: 1337
  log_every_steps: 1
  grad_clip: 1.0

inner_optimizer:
  name: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  scheduler: none
  warmup_steps: 0
  reset_on_global_update: true

outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

io:
  tensor_dtype: float32
  atomic_write: true
  compute_sha256: false
  keep_processed_updates: true
  cleanup_applied_after_versions: null
  sqlite_local_dir: null

learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true

failure_sim:
  enabled: false
  sleep_jitter_seconds: 0.0
  upload_skip_probability: 0.0
  crash_probability: 0.0
