run:
  name: fs_diloco_tiny_ha_dynamic_acceptance
  run_id: null
  shared_root: /work/xg24i002/x10041/fsb_decoupled_diloco/runs/fs_diloco/{run_id}
  log_level: INFO
model:
  name_or_path: synthetic-tiny
  dtype: float32
  compile: false
  synthetic_vocab_size: 64
  synthetic_hidden_size: 16
data:
  dataset_name: synthetic
  dataset_config_name: null
  train_split: train
  validation_split: validation
  block_size: 16
  num_proc: 1
  cache_dir: null
  streaming: false
  synthetic_num_batches: 16384
sync:
  num_learners: 8
  quorum_min: 7
  quorum_max: 8
  max_staleness_versions: 1
  staleness_lambda: 0.25
  selection_policy: most_recent_per_learner
  scan_interval_seconds: 0.2
  grace_window:
    mode: fixed
    fixed_seconds: 0.2
    max_seconds: 0.2
  stop_after_outer_steps: 120
  stop_file_poll_seconds: 0.2
coordination:
  leader:
    lease_duration_seconds: 15.0
    renew_interval_seconds: 0.1
    max_clock_skew_seconds: 1.0
    heartbeat_interval_seconds: 0.1
    heartbeat_stale_after_seconds: 5.0
    lease_busy_timeout_ms: 100
    business_busy_timeout_ms: 60000
    candidate_acquire_poll_seconds: 0.1
    candidate_wait_seconds: 20.0
    learner_recovery_wait_seconds: 120.0
    canonical_repair_wait_seconds: 10.0
    max_retained_epoch_dirs: 8
membership:
  mode: dynamic
  stream_pool_size: 8
  bootstrap_instances: 8
  initial_membership_deadline_seconds: 60.0
  registration_scan_interval_seconds: 0.2
  registration_request_ttl_seconds: 30.0
  heartbeat_stale_after_seconds: 5.0
  heartbeat_dead_after_seconds: 10.0
  revocation_grace_seconds: 1.0
  expired_retention_seconds: 5.0
  max_active_instance_records: 16
  allow_unsolicited_registration: false
  allow_healthy_placement_replacement: false
  reuse_stream_for_same_placement: true
scaling:
  enabled: true
  desired_contributors: 8
  low_contributor_threshold: 7
  consecutive_low_windows: 2
  productive_window_count: 2
  startup_grace_seconds: 5.0
  productive_upload_grace_factor: 2.0
  productive_upload_grace_min_seconds: 2.0
  productive_upload_grace_max_seconds: 10.0
  cooldown_seconds: 2.0
  max_pending_launch_requests: 1
  max_total_launch_requests: 4
  launch_request_ttl_seconds: 30.0
  capacity_observation_retention_count: 64
  scheduler_reconcile_interval_seconds: 1.0
  starvation_observation_seconds: 2.0
  learner_pbs_script: scripts/miyabi/run_dynamic_learner.pbs
  learner_walltime: 00:20:00
  learner_queue: regular-g
terminal:
  admission_close_policy: global_target_or_launch_budget
  drain_ack_timeout_seconds: 15.0
  registration_visibility_grace_seconds: 0.2
  proposal_visibility_grace_seconds: 0.2
  max_terminal_merges: 1
  allow_preclose_admission_during_drain: false
liveness:
  heartbeat_interval_seconds: 1.0
  stale_after_seconds: 5.0
  dead_after_seconds: 10.0
  no_progress_timeout_seconds: 120.0
training:
  inner_steps: 60
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  block_size: 16
  max_local_steps: null
  completion_mode: global_only
  precision: bf16
  seed: 1337
  log_every_steps: 60
  grad_clip: 1.0
inner_optimizer:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0
  scheduler: none
  warmup_steps: 0
outer_optimizer:
  name: nesterov
  lr: 0.5
  momentum: 0.9
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
io:
  tensor_dtype: bfloat16
  atomic_write: true
  compute_sha256: true
  checkpoint_digest_mode: false
syncer:
  device: cpu
  compute_dtype: float32
  publish_dtype: bfloat16
  parallel_checkpoint_writes: true
learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
wandb:
  enabled: false
  mode: offline
config_schema_version: 1
maintenance: {}
