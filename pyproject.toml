[project]
name = "fs-diloco-miyabi"
version = "0.1.0"
description = "Filesystem-backed Decoupled DiLoCo prototype for Miyabi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "safetensors",
    "pyyaml",
    "numpy",
    "tqdm",
    "typing-extensions",
    "wandb",
    "nvidia-ml-py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
eval = [
    "lm-eval[hf]>=0.4.12",
]

[project.scripts]
fs-diloco-syncer = "fs_diloco.runtime.syncer:main"
fs-diloco-learner = "fs_diloco.runtime.learner:main"
fs-diloco-inspect = "fs_diloco.tools.analysis:main"
fs-diloco-lm-eval = "fs_diloco.tools.eval_lm_harness:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
"fs_diloco.storage" = ["schema.sql"]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
