[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-diloco-miyabi"
version = "0.1.0"
description = "Filesystem-backed Decoupled DiLoCo prototype for Miyabi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "safetensors",
    "pyyaml",
    "numpy",
    "tqdm",
    "typing-extensions",
    "wandb",
    "nvidia-ml-py",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest",
    "pytest-timeout>=2.3",
    "ruff",
]
eval = [
    "lm-eval[hf]>=0.4.12",
]

[project.scripts]
fs-diloco-syncer = "fs_diloco.syncer:main"
fs-diloco-learner = "fs_diloco.learner:main"
fs-diloco-init-run = "fs_diloco.tools.init_run:main"
fs-diloco-launch-run = "fs_diloco.tools.launch_independent_run:main"
fs-diloco-migrate-config-v3-to-v4 = "fs_diloco.tools.migrate_config_v3_to_v4:main"
fs-diloco-inspect = "fs_diloco.tools.analysis:main"
fs-diloco-export-run-metrics = "fs_diloco.tools.run_metrics_csv:main"
fs-diloco-lm-eval = "fs_diloco.tools.eval_lm_harness:main"
fs-diloco-validation-eval = "fs_diloco.tools.validation_eval:main"
fs-diloco-publish-quality-gate = "fs_diloco.tools.publish_quality_gate:main"
fs-diloco-torch-baseline = "fs_diloco.baselines.train:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
timeout = 300
timeout_method = "thread"
xfail_strict = true
markers = [
    "plan03_red: pre-fix characterization for a Plan 03 accepted behavior defect",
    "state_machine: bounded generated protocol state-machine validation",
    "p6_formal: expensive formal Plan 03 P6 gate disabled from the default suite",
    "crash_matrix: deterministic publication crash-point validation",
    "integration: multi-component or real pipeline validation",
    "performance: paired performance or boundedness measurement",
]

[tool.setuptools.package-data]
"fs_diloco.storage" = ["schema.sql", "schema_v4.sql", "schema_v4_dynamic.sql"]

[tool.setuptools.packages.find]
include = ["fs_diloco*"]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
