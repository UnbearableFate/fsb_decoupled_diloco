config_schema_version: 3
run:
  name: plan04_full_protocol
model:
  name_or_path: synthetic-tiny
  dtype: float32
  synthetic_vocab_size: 128
  synthetic_hidden_size: 32
data:
  dataset_name: synthetic
  train_split: train
  block_size: 16
sync:
  quorum_min: 4
  quorum_max: 4
  staleness_lambda: 0.0
  scan_interval_seconds: 0.5
  stop_after_outer_steps: 10
syncer:
  device: cpu
  compute_dtype: float32
  publish_dtype: float32
membership:
  stream_pool_size: 8
  bootstrap_instances: 8
  initial_membership_deadline_seconds: 120.0
  registration_scan_interval_seconds: 0.5
  registration_request_ttl_seconds: 30.0
  heartbeat_dead_after_seconds: 10.0
scaling:
  enabled: false
terminal:
  admission_close_policy: global_target_or_launch_budget
  drain_ack_timeout_seconds: 60.0
  registration_visibility_grace_seconds: 2.0
  proposal_visibility_grace_seconds: 5.0
  max_terminal_merges: 0
training:
  inner_steps: 100
  micro_batch_size: 1
  gradient_accumulation_steps: 2
  seed: 1337
inner_optimizer:
  name: adamw
  lr: 0.00005
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  scheduler: none
  warmup_steps: 0
  min_lr_ratio: 0.1
outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
io:
  tensor_dtype: float32
learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
  global_adoption_strategy: replace
  post_publish_latest_wait_seconds: 0.0
  post_publish_latest_poll_seconds: 0.2
leader:
  lease_duration_seconds: 15.0
  renew_interval_seconds: 2.0
  max_clock_skew_seconds: 1.0
  business_busy_timeout_ms: 5000
  candidate_acquire_poll_seconds: 0.5
  candidate_wait_seconds: 180.0
  learner_recovery_wait_seconds: 180.0
maintenance:
  archive_batch_rows: 256
  recent_batch_dedup_count: 64
  quarantine_records_per_contributor: 64
  publication_orphan_grace_seconds: 20.0
